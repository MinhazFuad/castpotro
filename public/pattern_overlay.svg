<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <!-- Box 1 -->
  <g transform="translate(50, 50)">
    <rect width="100" height="100" fill="none" stroke="#94a3b8" stroke-width="4"/>
    <line x1="0" y1="50" x2="100" y2="50" stroke="#3b82f6" stroke-width="8"/>
  </g>
  <!-- Plus -->
  <text x="210" y="115" font-size="40" fill="#94a3b8" font-family="sans-serif" font-weight="bold">+</text>
  <!-- Box 2 -->
  <g transform="translate(250, 50)">
    <rect width="100" height="100" fill="none" stroke="#94a3b8" stroke-width="4"/>
    <line x1="50" y1="0" x2="50" y2="100" stroke="#3b82f6" stroke-width="8"/>
  </g>
  <!-- Equals -->
  <text x="410" y="115" font-size="40" fill="#94a3b8" font-family="sans-serif" font-weight="bold">=</text>
  <!-- Box 3 (?) -->
  <g transform="translate(450, 50)">
    <rect width="100" height="100" fill="none" stroke="#94a3b8" stroke-width="4"/>
    <text x="35" y="65" font-size="40" fill="#94a3b8" font-family="sans-serif" font-weight="bold">?</text>
  </g>
</svg>
